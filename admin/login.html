<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Espace bureau — Robot'Hoche</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../images/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<script src="../assets/js/theme.js"></script>
</head>
<body>

<div class="login-shell">
  <div class="card login-card">
    <div class="nav-brand">
      <img src="../images/logo.jpg" alt="Logo Robot'Hoche">
      Robot'Hoche
    </div>
    <h1 style="font-size:1.4rem; text-align:center;">Espace bureau</h1>
    <p class="text-muted text-center">Réservé aux membres du bureau autorisés par le président.</p>

    <div class="form-message" id="form-message"></div>

    <form id="form-connexion" class="mt-3">
      <div class="field">
        <label for="champ-email">E-mail</label>
        <input class="input" type="email" id="champ-email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="champ-motdepasse">Mot de passe</label>
        <input class="input" type="password" id="champ-motdepasse" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="bouton-connexion" style="width:100%; justify-content:center;">Se connecter</button>
    </form>

    <p class="text-muted text-center mt-3">
      <a href="../index.html">← Retour au site</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/admin/login.js"></script>
</body>
</html>
